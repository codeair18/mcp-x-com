<!doctype html>

    <title>MCP browser automation - Search / X</title>

            </div>
            <a href="/alice/status/1000000000000000001">

            <button data-testid="reply" aria-label="5 Replies. Reply"></button>
            <button data-testid="retweet" aria-label="2 reposts. Repost"></button>
            <button data-testid="like" aria-label="10 Likes. Like"></button>
          </article>
          <article data-testid="tweet">
            <div data-testid="User-Name">
              <a href="/erin"><span>Erin Fixture</span></a>
